name: android-v2 CI

on:
  push:
    branches: [sonder-v2, main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-v2.yml"
  pull_request:
    branches: [main, sonder-v2]
    paths:
      - "android-native/**"
      - ".github/workflows/android-v2.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: android-native

jobs:
  build-test:
    name: Build + unit tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-native/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sonder-v2-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  release:
    name: Release build (signed if secrets present)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/sonder-v2' && github.event_name == 'push'
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        env:
          SONDER_KEYSTORE_B64: ${{ secrets.SONDER_KEYSTORE_B64 }}
          SONDER_KEYSTORE_PASSWORD: ${{ secrets.SONDER_KEYSTORE_PASSWORD }}
          SONDER_KEY_ALIAS: ${{ secrets.SONDER_KEY_ALIAS }}
          SONDER_KEY_PASSWORD: ${{ secrets.SONDER_KEY_PASSWORD }}
        run: |
          if [ -n "$SONDER_KEYSTORE_B64" ]; then
            echo "$SONDER_KEYSTORE_B64" | base64 -d > sonder-release.jks
            bash ./gradlew assembleRelease \
              -Psonder.release.storeFile="$PWD/sonder-release.jks" \
              -Psonder.release.storePassword="$SONDER_KEYSTORE_PASSWORD" \
              -Psonder.release.keyAlias="$SONDER_KEY_ALIAS" \
              -Psonder.release.keyPassword="$SONDER_KEY_PASSWORD"
          else
            echo "No signing secrets configured — signing with the debug key (not Play-publishable)."
            bash ./gradlew assembleRelease
          fi
          rm -f sonder-release.jks

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sonder-v2-release-apk
          path: android-native/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: warn
