name: android-v2 CI

# Builds and tests only. Release APK signing and publishing live in
# .github/workflows/release-v2.yml (v* tags or a manual run).

on:
  push:
    branches: [sonder-v2, main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-v2.yml"
  pull_request:
    branches: [main, sonder-v2]
    paths:
      - "android-native/**"
      - ".github/workflows/android-v2.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: android-native

jobs:
  build-test:
    name: Build + unit tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug

      # Compile check only: no signing secrets are passed, so the release variant
      # falls back to the debug key, and no artifact is uploaded. The signed
      # release APK is built and verified by .github/workflows/release-v2.yml.
      - name: Assemble release APK (compile check)
        run: bash ./gradlew assembleRelease

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-native/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sonder-v2-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
