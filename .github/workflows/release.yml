# Builds the Android release APK and publishes it as a GitHub Release.
# Triggered by pushes of version tags: v1.0.0, v1.2.3+4, ...

name: Release Android APK

on:
  push:
    tags:
      - 'v*'

# The release job needs write access to create the release and upload the APK.
permissions:
  contents: write

# Serialize runs per tag so two tag pushes can't race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK & create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Strip the leading 'v' from the tag so the APK's versionName matches
      # the release version (v1.0.0 -> 1.0.0). Flutter also accepts an
      # embedded build number (1.0.0+12) and splits it into
      # versionName 1.0.0 / versionCode 12 on Android.
      - name: Build release APK
        run: flutter build apk --release --build-name=${GITHUB_REF_NAME#v}

      # action-gh-release uploads assets under their file name, so rename
      # the APK to something descriptive: sonder-1.0.0.apk
      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "sonder-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }} # v1.0.0
          name: ${{ github.ref_name }} # release title
          generate_release_notes: true # auto-generated notes from merged PRs
          files: sonder-*.apk
          fail_on_unmatched_files: true # never publish a release without the APK
