# Builds the Sonder v2 (android-native) release APK and publishes it as a
# GitHub Release. Triggered by version tags (v1.0.0) or by hand from the
# Actions tab. This is the only workflow that publishes on v* tags.
#
# The tag supplies versionName only. versionCode is the workflow run number,
# which is monotonic and lets each release install over the previous one.

name: Release Android APK (v2)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for this build, e.g. 1.0.0"
        required: true

# The release job needs write access to create the release and upload the APK.
permissions:
  contents: write

# One group per tag: re-runs of the same tag queue instead of racing to
# create the same release, while different tags keep their own group and run
# concurrently. The group name is kept as-is so a run already queued under it
# is unaffected.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: android-native

jobs:
  release:
    name: Build APK & create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the generated release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # Tag v1.0.0 -> version 1.0.0; manual runs take the required `version` input.
      # versionCode comes from the run number: Android refuses to install an
      # update whose versionCode isn't higher than the installed one.
      # Inputs reach the shell through env, never through ${{ }} inside `run`,
      # which would splice the value straight into the script text.
      #
      # The resolved version is validated against a strict charset before it is
      # used anywhere, because it flows into $GITHUB_OUTPUT, into the staged APK
      # file name and into a grep pattern in the Verify step: newlines (which
      # would inject extra output lines), `/` and `..` (path traversal) and
      # regex metacharacters all have to be rejected up front.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # A tag ref is the only source of the version on that path. If the
            # operator also typed a `version`, it would be discarded silently and
            # the run would publish the tag's release while they believe they
            # shipped a different version — refuse instead.
            if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
              echo "::error::This run was dispatched on tag ${GITHUB_REF_NAME}, which supplies version ${VERSION}; the 'version' input (${INPUT_VERSION}) is ignored. Re-run the workflow against the branch to release ${INPUT_VERSION}."
              exit 1
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          # Operator-typed value: letters, digits, dot, underscore, plus and
          # hyphen only, starting with a letter or digit. Matched against the
          # whole string — `grep -qE` would return 0 as soon as any single line
          # matched, letting an embedded newline through. `%q` in the message
          # keeps a rejected value from starting a new workflow command line.
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Invalid version: allowed characters are letters, digits, dot, underscore, plus and hyphen, and it must start with a letter or digit (e.g. 1.0.0). Got: $(printf '%q' "$VERSION")"
            exit 1
          fi
          {
            echo "name<<SONDER_VERSION_EOF"
            echo "$VERSION"
            echo "SONDER_VERSION_EOF"
            echo "code=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      # Gate the release on the existing JVM suites (AccessPolicy, BlackjackRules,
      # ...) so a tag pushed on a broken commit can't produce a release.
      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-results
          # Workspace-relative: defaults.run.working-directory applies to `run`
          # steps only, never to `uses` steps.
          path: android-native/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      # Signing secrets are optional. Without them the release build falls back
      # to the debug key: the APK installs for sideloading but cannot be
      # published to Play.
      - name: Assemble release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SONDER_KEYSTORE_B64: ${{ secrets.SONDER_KEYSTORE_B64 }}
          SONDER_KEYSTORE_PASSWORD: ${{ secrets.SONDER_KEYSTORE_PASSWORD }}
          SONDER_KEY_ALIAS: ${{ secrets.SONDER_KEY_ALIAS }}
          SONDER_KEY_PASSWORD: ${{ secrets.SONDER_KEY_PASSWORD }}
        run: |
          SIGNING_ARGS=()
          if [ -n "$SONDER_KEYSTORE_B64" ]; then
            # Decode outside the checked-out workspace: RUNNER_TEMP is the runner's
            # own scratch dir, so the private key can never be picked up by an
            # artifact upload. The trap matters because a gradle failure under
            # `set -e` would otherwise abort past a plain `rm` at the end of the
            # step and leave the key on disk for every later step.
            KEYSTORE_PATH="$RUNNER_TEMP/sonder-release.jks"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            echo "$SONDER_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            SIGNING_ARGS+=(
              -Psonder.release.storeFile="$KEYSTORE_PATH"
              -Psonder.release.storePassword="$SONDER_KEYSTORE_PASSWORD"
              -Psonder.release.keyAlias="$SONDER_KEY_ALIAS"
              -Psonder.release.keyPassword="$SONDER_KEY_PASSWORD"
            )
          else
            echo "No signing secrets configured — signing with the debug key."
          fi
          bash ./gradlew assembleRelease \
            -Psonder.version.name="$VERSION_NAME" \
            -Psonder.version.code="$VERSION_CODE" \
            "${SIGNING_ARGS[@]}"

      # The release action only checks that a file exists. Verify what is
      # actually in it: the tagged version, and which key signed it — a
      # misspelled signing secret would otherwise publish a debug-signed APK
      # behind a green run.
      - name: Verify APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPECT_RELEASE_KEY: ${{ secrets.SONDER_KEYSTORE_B64 != '' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -qF -- "versionName='${VERSION_NAME}'" \
            || { echo "versionName is not ${VERSION_NAME}"; exit 1; }
          echo "$BADGING" | grep -qF -- "versionCode='${VERSION_CODE}'" \
            || { echo "versionCode is not ${VERSION_CODE}"; exit 1; }
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if [ "$EXPECT_RELEASE_KEY" = "true" ] && echo "$CERTS" | grep -qi "Android Debug"; then
            echo "Keystore secrets are configured but the APK is debug-signed."
            exit 1
          fi

      # The release action uploads assets under their file name, so give the APK
      # a descriptive one: sonder-v2-1.0.0.apk
      - name: Stage APK
        working-directory: .
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          cp "android-native/app/build/outputs/apk/release/app-release.apk" \
            "sonder-v2-${VERSION_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Sonder v2 ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: sonder-v2-*.apk
          fail_on_unmatched_files: true # never publish a release without the APK
