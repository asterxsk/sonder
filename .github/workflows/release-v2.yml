# Builds the Sonder v2 (android-native) release APK and publishes it as a
# GitHub Release. Triggered by version tags: v1.0.0, v1.0.0+12, ...
# Can also be run by hand from the Actions tab with an explicit version.

name: Release Android APK (v2)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for this build, e.g. 1.0.0"
        required: false
        default: ""

# The release job needs write access to create the release and upload the APK.
permissions:
  contents: write

# Serialize runs per ref so two tag pushes can't race each other.
concurrency:
  group: release-v2-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: android-native

jobs:
  release:
    name: Build APK & create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the generated release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # Tag v1.0.0 -> version 1.0.0. Manual runs use the `version` input, or
      # 0.0.0 when it is left blank so an unversioned run is obvious.
      # versionCode comes from the run number: Android refuses to install an
      # update whose versionCode isn't higher than the installed one.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Signing secrets are optional. Without them the release build falls back
      # to the debug key: the APK installs for sideloading but cannot be
      # published to Play.
      - name: Assemble release APK
        env:
          SONDER_KEYSTORE_B64: ${{ secrets.SONDER_KEYSTORE_B64 }}
          SONDER_KEYSTORE_PASSWORD: ${{ secrets.SONDER_KEYSTORE_PASSWORD }}
          SONDER_KEY_ALIAS: ${{ secrets.SONDER_KEY_ALIAS }}
          SONDER_KEY_PASSWORD: ${{ secrets.SONDER_KEY_PASSWORD }}
        run: |
          SIGNING_ARGS=()
          if [ -n "$SONDER_KEYSTORE_B64" ]; then
            echo "$SONDER_KEYSTORE_B64" | base64 -d > sonder-release.jks
            SIGNING_ARGS+=(
              -Psonder.release.storeFile="$PWD/sonder-release.jks"
              -Psonder.release.storePassword="$SONDER_KEYSTORE_PASSWORD"
              -Psonder.release.keyAlias="$SONDER_KEY_ALIAS"
              -Psonder.release.keyPassword="$SONDER_KEY_PASSWORD"
            )
          else
            echo "No signing secrets configured — signing with the debug key."
          fi
          bash ./gradlew assembleRelease \
            -Psonder.version.name="${{ steps.version.outputs.name }}" \
            -Psonder.version.code="${{ steps.version.outputs.code }}" \
            "${SIGNING_ARGS[@]}"
          rm -f sonder-release.jks

      # The release action uploads assets under their file name, so give the APK
      # a descriptive one: sonder-v2-1.0.0.apk
      - name: Stage APK
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          cp "android-native/app/build/outputs/apk/release/app-release.apk" \
            "sonder-v2-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Sonder v2 ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: sonder-v2-*.apk
          fail_on_unmatched_files: true # never publish a release without the APK
